<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="style.css"/>
    <script type="module" src="script.js"></script>
</head>
<body>
    <nav>
        <a href="/fourProjects/index.html"aria-current="page">Home</a>
        <a target ="_blank" href="https://www.youtube.com/">You Tube</a>
    </nav>
    <main>
        <h1 style="text-align: center;margin: 50px;">
            BMI calculator
        </h1>
        <form>
            <p><label>Enter height in cm:</label><input type="text" id="height"></p>
            <p><label>Enter weight in kg:</label><input type="text" id="weight"></p>
            <button id="calculate">Calculate</button>
            <div id="result"></div>
            <div class="bmi-guide">
                <h3>BMI Guide</h3>
                <p>Under weight : less than 18</p>
                <p>normal range : greater than 18 and less than 24.9</p>
                <p>Under weight : greater than 24.9</p>
            </div>
        </form>
    </main>
</body>
</html>
