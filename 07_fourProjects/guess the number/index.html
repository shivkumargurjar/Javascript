<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number guessing game</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <nav>
        <a href="/fourProjects/index.html"aria-current="page">Home</a>
        <a target ="_blank" href="https://www.youtube.com/">You Tube</a>
    </nav>
    <main class="container">
        <h2>Number Guessing Game</h2>
        <div class="game">
            <p style="font-size: 20px;">Try and guess any random number between 1 to 100.</p>
            <p style="font-size: 20px;"> You have 10 Number to guess right number. </p>
            <h1 style="margin-top: 30px;">Guess a Number</h1>
            <form>
                <input type="text" id="numin">
                <button id="submit">Submit Guess</button>
                <div id="score"></div>
                <div id="previous">Previous guesses:</div>
                <div id="remaining">Guesses remaining:</div>
            </form>
        </div>
    </main>
    <script type="module" src="script.js"></script>
</body>
</html>
